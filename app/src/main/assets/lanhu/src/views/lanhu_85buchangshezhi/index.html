<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>动物ICU重症监护系统</title>
  <link rel="stylesheet" href="../../assets/common.css" />
  <link rel="stylesheet" href="assets/index.css" />
  <link rel="stylesheet" href="../../../lanhu-fit.css" />
  <script src="../../../lanhu-fit.js"></script>
  <script src="../../../lanhu-bridge.js" defer></script>
  <script src="../../../lanhu-first-phase.js" defer></script>
</head>
<body>
<div class="page flex-col">
    <div class="box_1 flex-row">
      <img
        class="label_1"
        referrerpolicy="no-referrer"
        src="./assets/img/0167e0464361720e6197d46f49d3789e.png"
      />
      <span class="text_1">动物ICU重症监护系统</span>
      <img
        class="thumbnail_1"
        referrerpolicy="no-referrer"
        src="./assets/img/388cbadcf2882fde1b61377140df1c21.png"
      />
      <span class="text_2">动物样本</span>
      <div class="group_1 flex-row">
        <img
          class="image_1"
          referrerpolicy="no-referrer"
          src="./assets/img/de77b6e5e7d59644dd348fa4ee71a209.png"
        />
        <span class="text_3">设置</span>
      </div>
      <img
        class="label_2"
        referrerpolicy="no-referrer"
        src="./assets/img/52efeb9a32a71864c3e4b6824bc4ab7d.png"
      />
      <span class="text_4">黄医生</span>
      <img
        class="thumbnail_2"
        referrerpolicy="no-referrer"
        src="./assets/img/0d0599ae92f3fa5c0e0aafce52ee4074.png"
      />
    </div>
    <div class="group_7 flex-col">
      <div class="box_8 flex-row justify-between">
        <div class="block_1 flex-col">
          <span class="text_5">医院信息</span>
          <span class="text_6">仪器状态</span>
          <span class="text_7">报告模版-默认</span>
          <span class="text_8">连接状态</span>
          <div class="text-wrapper_1 flex-col"><span class="text_9">补偿设置</span></div>
          <span class="text_10">其他设置</span>
          <span class="text_11">关于</span>
          <span class="text_12">管理员设置</span>
        </div>
        <div class="block_2 flex-col">
          <div class="box_9 flex-row justify-between">
            <div class="block_3 flex-col">
              <span class="text_13">温度补偿&nbsp;&nbsp;℃</span>
              <div class="group_8 flex-row justify-between">
                <span class="text_14">39.5</span>
                <div class="box_4 flex-col"></div>
              </div>
              <div class="block_5 flex-col"><div class="block_6 flex-col"></div></div>
              <div class="image-wrapper_6 flex-row justify-between">
                <img
                  class="thumbnail_3"
                  referrerpolicy="no-referrer"
                  src="./assets/img/ca766383755a23855354fd6e40056a55.png"
                />
                <img
                  class="thumbnail_4"
                  referrerpolicy="no-referrer"
                  src="./assets/img/6acb080994c5e92d1408606ecb6e30ec.png"
                />
              </div>
            </div>
            <div class="block_7 flex-col">
              <span class="text_15">氧浓度补偿&nbsp;&nbsp;%</span>
              <div class="section_9 flex-row justify-between">
                <span class="text_16">36.6</span>
                <div class="section_2 flex-col"></div>
              </div>
              <div class="group_3 flex-col"><div class="group_4 flex-col"></div></div>
              <div class="image-wrapper_7 flex-row justify-between">
                <img
                  class="thumbnail_5"
                  referrerpolicy="no-referrer"
                  src="./assets/img/95cc8219eea3a571b9932aa6ba5488c5.png"
                />
                <img
                  class="thumbnail_6"
                  referrerpolicy="no-referrer"
                  src="./assets/img/f7220150d0d9ec9e756b706296130504.png"
                />
              </div>
            </div>
            <div class="block_8 flex-col">
              <span class="text_17">湿度补充&nbsp;&nbsp;%</span>
              <div class="block_14 flex-row justify-between">
                <span class="text_18">45.9</span>
                <div class="section_3 flex-col"></div>
              </div>
              <div class="group_6 flex-col"><div class="block_9 flex-col"></div></div>
              <div class="image-wrapper_8 flex-row justify-between">
                <img
                  class="thumbnail_7"
                  referrerpolicy="no-referrer"
                  src="./assets/img/c6126852579392ce592e601eb50bc6f0.png"
                />
                <img
                  class="thumbnail_8"
                  referrerpolicy="no-referrer"
                  src="./assets/img/f4c924e6fb612d15fdc1ff794c30fbad.png"
                />
              </div>
            </div>
          </div>
          <div class="box_10 flex-row justify-between">
            <div class="box_5 flex-col">
              <span class="text_19">二氧化碳浓度补偿&nbsp;&nbsp;PPM</span>
              <div class="group_9 flex-row justify-between">
                <span class="text_20">1000</span>
                <div class="block_11 flex-col"></div>
              </div>
              <div class="block_12 flex-col"><div class="block_13 flex-col"></div></div>
              <div class="image-wrapper_9 flex-row justify-between">
                <img
                  class="thumbnail_9"
                  referrerpolicy="no-referrer"
                  src="./assets/img/3e2ac60e8c51eb95b8eaacdcd856c333.png"
                />
                <img
                  class="thumbnail_10"
                  referrerpolicy="no-referrer"
                  src="./assets/img/5d2a527b1cf5020acfc137c9988ac7b8.png"
                />
              </div>
            </div>
            <div class="box_6 flex-col">
              <span class="text_21">红外体温&nbsp;&nbsp;℃</span>
              <div class="section_10 flex-row justify-between">
                <span class="text_22">32.0</span>
                <div class="section_6 flex-col"></div>
              </div>
              <div class="section_7 flex-col"><div class="box_7 flex-col"></div></div>
              <div class="image-wrapper_10 flex-row justify-between">
                <img
                  class="thumbnail_11"
                  referrerpolicy="no-referrer"
                  src="./assets/img/292544683b099b7827760f56bdaa73b2.png"
                />
                <img
                  class="thumbnail_12"
                  referrerpolicy="no-referrer"
                  src="./assets/img/4626196772a1e51b1411ee3a2ba59168.png"
                />
              </div>
            </div>
            <div class="text-wrapper_2 flex-col"><span class="text_23">+</span></div>
          </div>
          <div class="box_11 flex-row justify-between">
            <div class="text-wrapper_3 flex-col"><span class="text_24">保存</span></div>
            <div class="text-wrapper_4 flex-col"><span class="text_25">取消</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
<script src="../../../lanhu-routes.js" defer></script>
</body>
</html>
