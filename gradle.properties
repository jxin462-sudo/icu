org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Gradle ignores the Windows/IE proxy setting, so a proxy must be declared here
# or downloads fail with "Connection timed out: getsockopt".
# This machine has a proxy at 127.0.0.1:7890 that is NOT always running -- when
# it is down, an enabled proxy config makes Gradle fail with "could not connect"
# instead. So these are left commented out: uncomment only while the proxy runs.
# All build dependencies are already cached locally (.local-m2 + ~/.gradle), so
# an offline build needs no network at all.
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=7890
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=7890
#systemProp.http.nonProxyHosts=localhost|127.0.0.1
# AGP 9.x needs a JDK 21 toolchain, and it must not be a JetBrains JBR: Gradle
# 9.4.1 queries for nativeImageCapable=false, which JBR metadata does not
# satisfy, so a JBR 21 is detected and then rejected.
# Microsoft OpenJDK 21.0.12 (standalone, not a JBR) is installed and satisfies
# this -- Android Studio also lists it as "ms-21" in its JDK table. Pinning it
# here keeps the CLI build and Android Studio's Run on the same JVM.
# Auto-download stays off because it needs api.foojay.io, which is unreachable
# without the proxy.
org.gradle.java.home=C\:\\Users\\jx\\.jdks\\ms-21.0.12
org.gradle.java.installations.auto-download=false
android.useAndroidX=true
android.nonTransitiveRClass=false
# Disable Gradle Problems HTML generation to avoid Windows file overwrite issues.
org.gradle.problems.report=false
